function Tag({tag}) {
  const c = TAG_COLORS[tag] || {bg:"#333",text:"#fff",dot:"#fff"};
  return (
    <span style={{fontSize:10,background:c.bg,color:c.text,padding:"2px 8px",borderRadius:10,display:"inline-flex",alignItems:"center",gap:4}}>
      <span style={{width:5,height:5,borderRadius:"50%",background:c.dot,display:"inline-block"}}/>
      {tag}
    </span>
  );
}

function SpotCard({spot,isAlt,expanded,onToggle,accent}) {
  return (
    <div onClick={onToggle} style={{background:expanded?"#1a1a2e":"#13131f",border:`1px solid ${expanded?accent+"70":"#ffffff12"}`,borderRadius:14,padding:"12px 14px",cursor:"pointer",transition:"all 0.2s",borderLeft:isAlt?"3px solid #ffffff18":undefined,marginBottom:0}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,minWidth:42}}>
          <div style={{fontSize:20,width:38,height:38,background:`${accent}20`,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center"}}>{spot.emoji}</div>
          {spot.time&&<div style={{fontSize:9,color:"#555",textAlign:"center"}}>{spot.time}</div>}
        </div>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            <span style={{fontSize:13,fontWeight:700,color:"#f0f0ff"}}>{spot.name}</span>
            {spot.rating&&<span style={{fontSize:10,color:"#fbbf24",background:"#2a2000",padding:"1px 6px",borderRadius:10}}>⭐{spot.rating}</span>}
          </div>
          <div style={{fontSize:11,color:"#8888aa",marginTop:2}}>{spot.sub}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:6}}>
            {spot.tags&&spot.tags.map(t=><Tag key={t} tag={t}/>)}
            {spot.cost&&<span style={{fontSize:10,background:"#2a2a00",color:"#ffd43b",padding:"2px 8px",borderRadius:10}}>💴 {spot.cost}</span>}
            {spot.mapUrl&&(
              <button onClick={e=>{e.stopPropagation();openMap(spot.mapUrl);}}
                style={{fontSize:10,background:"#1a2a1a",border:"1px solid #22c55e40",color:"#4ade80",padding:"2px 8px",borderRadius:10,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:3}}>
                🗺️ 導航
              </button>
            )}
          </div>
        </div>
        <div style={{color:"#444",fontSize:11,transform:expanded?"rotate(180deg)":"none",transition:"transform 0.2s",paddingTop:2,flexShrink:0}}>▼</div>
      </div>
      {expanded&&(
        <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${accent}30`}}>
          <div style={{fontSize:12,color:"#b0b0cc",lineHeight:1.75,marginBottom:10,background:"#ffffff05",padding:10,borderRadius:8}}>
            {spot.desc&&spot.desc.split('\n').map((l,i)=><div key={i}>{l}</div>)}
          </div>
          {spot.nearbyLinks&&spot.nearbyLinks.length>0&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:10,color:accent,fontWeight:700,marginBottom:6}}>📍 地圖快速連結</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {spot.nearbyLinks.map((lnk,li)=>(
                  <button key={li} onClick={e=>{e.stopPropagation();openMap(lnk.url);}}
                    style={{background:"#1a2a3a",border:"1px solid #4dabf740",color:"#60a5fa",borderRadius:20,padding:"3px 8px",fontSize:9,cursor:"pointer"}}>
                    📍 {lnk.label}
                  </button>
                ))}
              </div>
            </div>
          )}
          {spot.tips&&spot.tips.length>0&&(
            <div>
              <div style={{fontSize:10,color:accent,fontWeight:700,marginBottom:6}}>💡 提醒 / 推薦</div>
              {spot.tips.map((tip,ti)=>(
                <div key={ti} style={{fontSize:11,color:"#9999bb",padding:"3px 0 3px 12px",borderLeft:`2px solid ${accent}40`,marginBottom:3,lineHeight:1.5}}>· {tip}</div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  const [expandHotel,setExpandHotel] = useState(false);
  const [checked,setChecked] = useState({});

  const day = DAYS[activeDay];
  const hotel = day.hotelCity ? HOTELS[day.hotelCity] : null;
  const accent = DAY_COLORS[activeDay];
  const doneCount = CHECKLIST.filter(i=>checked[i.id]).length;
  const groups = [...new Set(CHECKLIST.map(i=>i.day))];

  const sw = (i) => { setActiveDay(i); setExpandedSpot(null); setExpandedAlt(null); setExpandHotel(false); };
  const sv = (v) => { setView(v); setExpandedSpot(null); setExpandedAlt(null); };

          <span style={{fontSize:22}}>🌸</span>
          <div>
            <div style={{fontSize:17,fontWeight:700}}>京都・大阪旅行手冊</div>
            <div style={{fontSize:11,color:"#8888aa",marginTop:1}}>6天5晚 · 2026年6月</div>
          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:5}}>
            <span style={{fontSize:10,background:"#ffffff12",padding:"3px 8px",borderRadius:20,color:"#aaa"}}>🔒 私密</span>
            <span style={{fontSize:10,background:"#ffffff12",padding:"3px 8px",borderRadius:20,color:"#aaa"}}>👥 4名</span>
          </div>
        </div>
        <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:10,scrollbarWidth:"none"}}>
          {DAYS.map((d,i)=>(
            <button key={i} onClick={()=>sw(i)}
              style={{flexShrink:0,background:activeDay===i?DAY_COLORS[i]:"#ffffff10",color:activeDay===i?"#000":"#888",border:"none",borderRadius:20,padding:"5px 12px",fontSize:11,fontWeight:activeDay===i?700:400,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
              <span>{d.emoji}</span><span>第{d.day}天</span><span style={{fontSize:9}}>{d.date}</span>
            </button>
          ))}
        </div>
        <div style={{display:"flex",background:"#ffffff08",borderRadius:10,padding:3,marginBottom:12}}>
          {VIEWS.map((v,vi)=>(
            <button key={v} onClick={()=>sv(v)}
              style={{flex:1,background:view===v?accent:"transparent",color:view===v?"#000":"#777",border:"none",borderRadius:8,padding:"6px 2px",fontSize:11,fontWeight:600,cursor:"pointer"}}>
              {VIEW_ICONS[vi]} {v}
            </button>
          ))}
        </div>
      </div>

      {/* DAY LABEL */}
      <div style={{background:`linear-gradient(90deg,${accent}22,transparent)`,borderLeft:`3px solid ${accent}`,margin:"12px 16px 6px",padding:"8px 12px",borderRadius:"0 8px 8px 0"}}>
        <div style={{fontSize:13,fontWeight:700,color:accent}}>{day.emoji} Day {day.day}｜{day.label}</div>
        <div style={{fontSize:11,color:"#888",marginTop:2}}>📍 {day.city}{hotel?` · 🏨 ${hotel.name}`:""}</div>
      </div>

      {/* CONTENT */}
      <div style={{flex:1,padding:"4px 16px 90px"}}>

        {/* 行程 */}
        {view==="行程"&&day.spots.map((spot,i)=>(
          <div key={i}>
            {i>0&&<div style={{width:2,height:8,background:`${accent}35`,margin:"0 0 0 23px"}}/>}
            <SpotCard spot={spot} expanded={expandedSpot===i} onToggle={()=>setExpandedSpot(expandedSpot===i?null:i)} accent={accent}/>
          </div>
        ))}

        {/* 住宿 */}
        {view==="住宿"&&(hotel?(
          <div>
            <div onClick={()=>setExpandHotel(!expandHotel)}
              style={{background:expandHotel?"#1a1a2e":"#13131f",border:`1px solid ${expandHotel?accent+"70":"#ffffff12"}`,borderRadius:16,padding:16,cursor:"pointer",marginBottom:12}}>
              <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                <div style={{fontSize:26,width:50,height:50,background:`${accent}20`,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center"}}>{hotel.emoji}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:15,fontWeight:700,color:"#f0f0ff"}}>{hotel.name}</div>
                  <div style={{fontSize:11,color:"#8888aa",marginTop:2}}>📍 {hotel.area}</div>
                  <div style={{fontSize:11,color:"#888",marginTop:2}}>🗓️ {hotel.nights}</div>
                  <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:8}}>
                    <Tag tag="住宿"/>
                    <span style={{fontSize:10,background:"#1e2a1e",color:"#86efac",padding:"2px 8px",borderRadius:10}}>✔ Check-in {hotel.checkin}</span>
                    <span style={{fontSize:10,background:"#2a1e1e",color:"#fca5a5",padding:"2px 8px",borderRadius:10}}>✖ Check-out {hotel.checkout}</span>
                    <button onClick={e=>{e.stopPropagation();openMap(hotel.mapUrl);}}
                      style={{fontSize:10,background:"#1a2a1a",border:"1px solid #22c55e40",color:"#4ade80",padding:"2px 8px",borderRadius:10,cursor:"pointer"}}>🗺️ 導航到飯店</button>
                  </div>
                </div>
                <div style={{color:"#444",fontSize:11,transform:expandHotel?"rotate(180deg)":"none",transition:"transform 0.2s"}}>▼</div>
              </div>
              {expandHotel&&(
                <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${accent}30`}}>
                  <div style={{fontSize:10,color:accent,fontWeight:700,marginBottom:8}}>✨ 飯店優勢</div>
                  {hotel.features.map((f,fi)=>(
                    <div key={fi} style={{fontSize:12,color:"#b0b0cc",padding:"4px 0 4px 12px",borderLeft:`2px solid ${accent}40`,marginBottom:4,lineHeight:1.5}}>· {f}</div>
                  ))}
                </div>
              )}
            </div>
            <div style={{background:"#13131f",border:"1px solid #ffffff12",borderRadius:14,padding:14,marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:700,color:"#f0f0ff",marginBottom:10}}>🗺️ 酒店週邊（點擊導航）</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {hotel.nearby.map((item,ni)=>{
                  const isCvn = item.name.includes("全家")||item.name.includes("7-11")||item.name.includes("LAWSON")||item.name.includes("LIFE")||item.name.includes("🏪")||item.name.includes("🛒");
                  const isFood = item.name.includes("定食")||item.name.includes("串燒")||item.name.includes("餐廳")||item.name.includes("咖啡")||item.name.includes("麵包")||item.name.includes("珈琲")||item.name.includes("🍽️")||item.name.includes("☕")||item.name.includes("🥐");
                  return (
                    <button key={ni} onClick={()=>openMap(item.url)}
                      style={{fontSize:11,background:isCvn?"#1a2d1a":isFood?"#3a2a10":"#1a1a2e",color:isCvn?"#86efac":isFood?"#fb923c":"#a78bfa",padding:"5px 10px",borderRadius:20,border:"none",cursor:"pointer"}}>
                      {item.name}
                    </button>
                  );
                })}
              </div>
            </div>
            {activeDay===3&&(
              <div style={{background:"#2a1a00",border:"1px solid #fb923c40",borderRadius:12,padding:"10px 14px"}}>
                <div style={{fontSize:11,color:"#fb923c",fontWeight:700,marginBottom:4}}>📦 今日搬家提醒</div>
                <div style={{fontSize:12,color:"#cc9966",lineHeight:1.6}}>今天從京都梅小路酒店 → 大阪四季靱公園酒店。包車行程結束後直接抵達新飯店，無需自行搬運。</div>
              </div>
            )}
          </div>
        ):(
          <div style={{background:"#13131f",border:"1px solid #ffffff12",borderRadius:14,padding:20,textAlign:"center"}}>
            <div style={{fontSize:32,marginBottom:8}}>✈️</div>
            <div style={{fontSize:13,color:"#8888aa"}}>Day 6 回程日，無住宿安排</div>
            <div style={{fontSize:11,color:"#555",marginTop:6}}>19:05 航班返台，一路順風！</div>
          </div>
        ))}

        {/* 備選 */}
        {view==="備選"&&(
          <div>
            {day.alternates.length>0?(
              <div>
                <div style={{fontSize:11,color:"#8888aa",marginBottom:12,lineHeight:1.6,background:"#ffffff06",padding:"10px 12px",borderRadius:10}}>
                  ☂️ 天氣不佳或體力不足時的替換方案
                </div>
                {day.alternates.map((alt,i)=>(
                  <div key={i} style={{marginBottom:10}}>
                    <SpotCard spot={alt} isAlt expanded={expandedAlt===i} onToggle={()=>setExpandedAlt(expandedAlt===i?null:i)} accent={accent}/>
                  </div>
                ))}
              </div>
            ):(
              <div style={{background:"#13131f",border:"1px solid #ffffff12",borderRadius:14,padding:"16px",marginBottom:12,textAlign:"center"}}>
                <div style={{fontSize:28,marginBottom:6}}>🎯</div>
                <div style={{fontSize:13,color:"#8888aa"}}>此日行程已固定，無備選方案</div>
              </div>
            )}
            {activeDay<=2&&(
              <div style={{marginTop:6}}>
                <div style={{fontSize:11,color:"#777",fontWeight:700,marginBottom:8,padding:"6px 10px",background:"#ffffff06",borderRadius:8}}>
                  📌 京都備選清單（A–G，全部下雨/停駛可用）
                </div>
                {KYOTO_BACKUPS.map((item,ii)=>(
                  <div key={ii} style={{background:"#13131f",border:"1px solid #ffffff10",borderRadius:12,padding:"10px 12px",marginBottom:8,display:"flex",gap:10,alignItems:"flex-start"}}>
                    <span style={{fontSize:20}}>{item.emoji}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,color:"#e0e0f0"}}>{item.name}</div>
                      <div style={{fontSize:11,color:"#777",marginTop:1}}>{item.sub}</div>
                      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:6}}>
                        {item.tags.map(t=><Tag key={t} tag={t}/>)}
                        <span style={{fontSize:10,background:"#2a2a00",color:"#ffd43b",padding:"2px 8px",borderRadius:10}}>💴 {item.cost}</span>
                        {item.mapUrl&&<button onClick={()=>openMap(item.mapUrl)} style={{fontSize:10,background:"#1a2a1a",border:"1px solid #22c55e40",color:"#4ade80",padding:"2px 8px",borderRadius:10,cursor:"pointer"}}>🗺️ 導航</button>}
                      </div>
                      <div style={{fontSize:11,color:"#9999bb",marginTop:6,padding:"4px 0 4px 10px",borderLeft:"2px solid #ffffff20"}}>· {item.tip}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* 清單 */}
        {view==="清單"&&(
          <div>
            <div style={{background:"#13131f",border:"1px solid #ffffff12",borderRadius:14,padding:"14px 16px",marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:13,fontWeight:700,color:"#f0f0ff"}}>出發前準備清單</span>
                <span style={{fontSize:13,color:accent,fontWeight:700}}>{doneCount}/{CHECKLIST.length}</span>
              </div>
              <div style={{height:6,background:"#ffffff10",borderRadius:10,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${(doneCount/CHECKLIST.length)*100}%`,background:accent,borderRadius:10,transition:"width 0.4s"}}/>
              </div>
              <div style={{fontSize:11,color:"#666",marginTop:6}}>
                {doneCount===CHECKLIST.length?"🎉 全部完成！出發囉～":`還有 ${CHECKLIST.length-doneCount} 項待完成`}
              </div>
            </div>
            {groups.map(group=>(
              <div key={group} style={{marginBottom:14}}>
                <div style={{fontSize:11,color:accent,fontWeight:700,marginBottom:6}}>📌 {group}</div>
                {CHECKLIST.filter(i=>i.day===group).map(item=>(
                  <div key={item.id} onClick={()=>setChecked(p=>({...p,[item.id]:!p[item.id]}))}
                    style={{display:"flex",alignItems:"center",gap:12,background:checked[item.id]?"#0d1a0d":"#13131f",border:`1px solid ${checked[item.id]?"#1a3a1a":"#ffffff10"}`,borderRadius:12,padding:"10px 14px",marginBottom:6,cursor:"pointer",transition:"all 0.2s"}}>
                    <div style={{width:22,height:22,borderRadius:6,flexShrink:0,background:checked[item.id]?"#22c55e":"#ffffff10",border:`2px solid ${checked[item.id]?"#22c55e":"#ffffff20"}`,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s"}}>
                      {checked[item.id]&&<span style={{fontSize:12,color:"#fff"}}>✓</span>}
                    </div>
                    <span style={{fontSize:12,color:checked[item.id]?"#555":"#d0d0e8",textDecoration:checked[item.id]?"line-through":"none",lineHeight:1.4}}>
                      {item.text}
                    </span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
      </div>

      {/* LEGEND */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"linear-gradient(0deg,#0a0a0f 85%,transparent)",padding:"10px 16px 18px",display:"flex",justifyContent:"center",gap:14}}>
        {Object.entries(TAG_COLORS).map(([tag,c])=>(
          <div key={tag} style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:c.dot}}/>
            <span style={{fontSize:10,color:"#555"}}>{tag}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
